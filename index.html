<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mia agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecede3;--card:#fbfbf6;--ink:#233027;--mut:#6b7566;--line:#d9dccb;--pri:#4a7352;--ps:#dfe9d8;--mint:#6f9f6b;--ms:#dfe9d8;--ac:#9a6a36;--as:#f0e3d0;--op:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b16;--card:#1e271f;--ink:#e7ebe0;--mut:#9aa793;--line:#2f3a30;--pri:#8cc38a;--ps:#2a3a2c;--mint:#86c285;--ms:#22402a;--ac:#dba56e;--as:#3b2f22;--op:#13201a}}
:root[data-theme="dark"]{--bg:#151b16;--card:#1e271f;--ink:#e7ebe0;--mut:#9aa793;--line:#2f3a30;--pri:#8cc38a;--ps:#2a3a2c;--mint:#86c285;--ms:#22402a;--ac:#dba56e;--as:#3b2f22;--op:#13201a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,-apple-system,sans-serif}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:12px 0 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.tabs button{flex:1;border:0;border-radius:999px;padding:10px 4px;font-weight:800;font-size:14px;background:transparent;color:var(--mut);cursor:pointer;white-space:nowrap}
.tabs button[aria-current=page]{background:var(--pri);color:var(--op)}
.head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;text-align:center}
h1{margin:0;font:400 32px/1.1 "Young Serif",Georgia,serif;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--pri);font-size:24px;cursor:pointer;box-shadow:0 2px 10px rgba(35,48,39,.12)}
.card{background:var(--card);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(35,48,39,.07)}
h2{margin:0 0 4px;font:400 19px/1.3 "Young Serif",Georgia,serif}
.sub{color:var(--mut);font-size:14px;margin:0 0 6px}
.empty{color:var(--mut);margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx{flex:1;min-width:0;overflow-wrap:anywhere}
.done .tx{text-decoration:line-through;color:var(--mut)}
.tm{font-weight:800;color:var(--ac);background:var(--as);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.ck,.dot{border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;flex:none;position:relative;padding:0}
.ck{width:26px;height:26px}
.dot{width:32px;height:32px}
.ck.on,.dot.on{background:var(--mint);border-color:var(--mint)}
.ck.on::after,.dot.on::after,.chip.on i::after{content:"";position:absolute;left:50%;top:50%;width:55%;height:55%;border-radius:0 100% 0 100%;background:var(--op);transform:translate(-50%,-50%)}
.mini{border:0;background:var(--ps);color:var(--pri);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.del{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:6px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add input{flex:1 1 140px;min-width:0;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.add input[type=time]{flex:0 0 112px}
.btn{border:0;border-radius:14px;background:var(--pri);color:var(--op);font-weight:800;padding:11px 18px;cursor:pointer}
.lnk{border:0;background:none;color:var(--pri);font-weight:700;cursor:pointer;padding:6px 0}
.hh{display:flex;align-items:center;gap:10px}.hh h2{flex:1;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ch{display:inline-flex;align-items:center}
.chip{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:transparent;border-radius:999px;padding:10px 18px 10px 12px;font-weight:700;cursor:pointer;text-align:left}
.chip i{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);position:relative}
.chip.on{background:var(--ms);border-color:var(--mint)}
.chip.on i{background:var(--mint);border-color:var(--mint)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;justify-items:center}
.dl{font-size:12px;color:var(--mut);text-align:center;font-weight:700;line-height:1.25}.dl.t{color:var(--pri)}
.dot.fut{opacity:.35;cursor:default}
.hb{margin:16px 0 0}
.hn{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:8px}.hn b{color:var(--mint)}
.pb{height:8px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:var(--mint);border-radius:99px}
.big{font:400 48px/1 "Young Serif",Georgia,serif;color:var(--pri)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;width:max-content;margin:12px auto}
.seg button{border:0;background:none;padding:8px 22px;border-radius:999px;font-weight:800;color:var(--mut);cursor:pointer}.seg button.on{background:var(--ps);color:var(--pri)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:color-mix(in srgb,var(--mint) var(--v),var(--bg));color:var(--ink);font-weight:700;cursor:pointer;position:relative;padding:0}
.cell.hi{color:#0d2b25}
.cell.td{outline:2.5px solid var(--pri)}
.cell u{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pri)}
.yr{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:10px 0}
.yr .pb{margin:0}.yr b{text-align:right}
.asg input{flex:0 0 112px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.tg{position:relative;padding-top:10px;margin-top:10px}
.hr{height:48px;border-top:1px solid var(--line);position:relative}
.hr span{position:absolute;left:0;top:-10px;font-size:12px;color:var(--mut);background:var(--card);padding-right:6px}
.evs{position:absolute;top:10px;bottom:0;left:46px;right:0}
.ev{position:absolute;border:0;border-left:4px solid var(--ac);border-radius:10px;background:var(--as);color:var(--ink);padding:3px 8px;font-size:13px;font-weight:700;text-align:left;overflow:hidden;cursor:pointer}
.ev.done{opacity:.55;text-decoration:line-through;border-left-color:var(--mint)}
.ev.sel{outline:2px solid var(--pri)}
.now{position:absolute;left:-6px;right:0;height:2px;background:#c4573a;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:inline-block;text-align:center}
@media(max-width:420px){h1{font-size:26px}.chip{padding-right:14px}}
</style>
</head>
<body>
<div class="wrap"><nav class="tabs" id="N"></nav><main id="A"></main></div>
<script>
const K='agenda-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.habits)S={habits:[{id:'h1',n:'Dormire 8 ore'},{id:'h2',n:'Bere 2 litri d\u2019acqua'}],days:{},goals:[]};
let ref=null,pushing=false,dirty=false,tm=null;
const save=()=>{S.at=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(push,800)};
async function push(){
  if(!ref)return;
  if(pushing){dirty=true;return}
  pushing=true;
  try{await ref.set({s:JSON.stringify(S),at:S.at||Date.now()})}catch(e){}
  pushing=false;
  if(dirty){dirty=false;push()}
}
async function pull(){
  if(!ref)return;
  try{
    const sn=await ref.get();
    if(sn.exists){
      const r=sn.data();
      if(r.at>(S.at||0)){S=JSON.parse(r.s);try{localStorage.setItem(K,r.s)}catch(e){}render();return}
      if(r.at<(S.at||0))push();
    }else push();
  }catch(e){}
}
(async()=>{
  try{
    const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!u||!db)return;
    const id=await u.id();
    ref=db.collection('data/users/'+id).doc('agenda');
    pull();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
  }catch(e){}
})();
const p=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const sm=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+p(d.getMonth()+1)};
const today=iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const L=(s,o)=>pd(s).toLocaleDateString('it-IT',o);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pc=(a,b)=>b?Math.round(100*a/b):0;
const day=k=>S.days[k]||(S.days[k]={tasks:[],events:[],checks:{}});
const empty='<p class="empty">Aggiungi un\u2019abitudine da \u201cOggi\u201d per vedere i progressi.</p>';
let v='oggi',cur=today,wk=today,mo=today.slice(0,7),yr=false,gm=today.slice(0,7),editH=false,asg=null,gv=true,selE=null,bmsg='';

function stats(a,b){
  let n=0,tot=0,per={};S.habits.forEach(h=>per[h.id]=0);
  for(let k=a;k<=b&&k<=today;k=add(k,1)){n++;const d=S.days[k];if(d)S.habits.forEach(h=>{if(d.checks[h.id]){per[h.id]++;tot++}})}
  return{n,tot,per,max:n*S.habits.length};
}
const hbars=st=>S.habits.length?S.habits.map(h=>{const q=pc(st.per[h.id],st.n);return `<div class="hb"><div class="hn"><span>${esc(h.n)}</span><b>${q}%</b></div><div class="pb"><i style="width:${q}%"></i></div></div>`}).join(''):empty;
const head=(t,s,a,b)=>`<div class="head"><button class="ic" data-a="${a}" aria-label="Precedente">\u2039</button><div><h1>${t}</h1><p>${s}</p></div><button class="ic" data-a="${b}" aria-label="Successivo">\u203A</button></div>`;

function gridHTML(ev){
  const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m},H=48;
  const it=ev.map(e=>{const s=tm(e.s);let f=e.e?tm(e.e):s+60;if(f<=s)f=s+60;return{e,s,f:Math.min(f,1440)}});
  let a=7,z=21;it.forEach(o=>{a=Math.min(a,Math.floor(o.s/60));z=Math.max(z,Math.ceil(o.f/60))});
  const cols=[];it.forEach(o=>{let c=0;while(cols[c]!==undefined&&cols[c]>o.s)c++;o.c=c;cols[c]=o.f});
  it.forEach(o=>{let n=o.c;it.forEach(q=>{if(q.s<o.f&&q.f>o.s)n=Math.max(n,q.c)});o.n=n+1});
  let rows='';for(let h=a;h<z;h++)rows+=`<div class="hr"><span>${p(h)}:00</span></div>`;
  const nw=new Date(),m=nw.getHours()*60+nw.getMinutes(),sel=ev.find(e=>e.id===selE);
  return `<div class="tg" style="height:${(z-a)*H+10}px">${rows}<div class="evs">`
  +it.map(o=>`<button class="ev ${o.e.x?'done':''} ${selE===o.e.id?'sel':''}" data-a="se" data-i="${o.e.id}" style="top:${(o.s-a*60)*H/60}px;height:${Math.max(26,(o.f-o.s)*H/60-2)}px;left:${o.c*100/o.n}%;width:calc(${100/o.n}% - 3px)">${o.e.s} ${esc(o.e.t)}</button>`).join('')
  +(cur===today&&m>=a*60&&m<z*60?`<div class="now" style="top:${(m-a*60)*H/60}px"></div>`:'')
  +`</div></div>`
  +(sel?`<div class="row"><span class="tx">${sel.s}${sel.e?'\u2013'+sel.e:''} ${esc(sel.t)}</span><button class="mini" data-a="xe" data-i="${sel.id}">${sel.x?'Non fatto':'Fatto'}</button><button class="mini" data-a="de" data-i="${sel.id}">Elimina</button></div>`:'<p class="sub" style="margin-top:8px">Tocca un appuntamento per segnarlo come fatto o eliminarlo.</p>');
}
function oggi(){
  const d=day(cur),nx=add(cur,1),dx=day(nx),H=S.habits.length;
  const ev=[...d.events].sort((a,b)=>a.s.localeCompare(b.s));
  const done=S.habits.filter(h=>d.checks[h.id]).length;
  return head(cap(L(cur,{weekday:'long'})),L(cur,{day:'numeric',month:'long',year:'numeric'}),'dp','dn')
  +(cur===today?'':'<div style="text-align:center"><button class="lnk" data-a="td">Torna a oggi</button></div>')
  +`<section class="card"><div class="hh"><h2>Appuntamenti</h2>${ev.length?`<button class="lnk" data-a="gv">${gv?'Elenco':'Griglia'}</button>`:''}</div>`
  +(ev.length&&gv?gridHTML(ev):ev.length?ev.map(e=>`<div class="row ${e.x?'done':''}"><button class="ck ${e.x?'on':''}" data-a="xe" data-i="${e.id}" aria-label="Segna come fatto"></button><span class="tm">${e.s}${e.e?'\u2013'+e.e:''}</span><span class="tx">${esc(e.t)}</span><button class="del" data-a="de" data-i="${e.id}" aria-label="Elimina">\u2715</button></div>`).join(''):'<p class="empty">Nessun appuntamento. Aggiungi tutto ci\u00f2 che ha un orario.</p>')
  +`<form class="add" data-f="ev"><input name="t" placeholder="Cosa?" required><input type="time" name="s" required aria-label="Inizio"><input type="time" name="e" aria-label="Fine (facoltativa)"><button class="btn">Aggiungi</button></form></section>`
  +`<section class="card"><h2>Da fare</h2><p class="sub">Cose senza orario. Con \u201cOrario\u201d le metti in agenda.</p>`
  +(d.tasks.length?d.tasks.map(t=>asg===t.id
    ?`<form class="row asg" data-f="as" data-i="${t.id}"><span class="tx">${esc(t.t)}</span><input type="time" name="s" required aria-label="Orario"><button class="btn">Metti in agenda</button></form>`
    :`<div class="row ${t.x?'done':''}"><button class="ck ${t.x?'on':''}" data-a="xt" data-i="${t.id}" aria-label="Segna come fatta"></button><span class="tx">${esc(t.t)}</span><button class="mini" data-a="as" data-i="${t.id}">\u23F0 Orario</button><button class="mini" data-a="mv" data-i="${t.id}" title="Sposta al giorno dopo">\u2192 ${cur===today?'Domani':'Dopo'}</button><button class="del" data-a="dt" data-i="${t.id}" aria-label="Elimina">\u2715</button></div>`).join(''):'<p class="empty">Niente in lista. Scrivi cosa vuoi fare oggi.</p>')
  +`<form class="add" data-f="tk"><input name="t" placeholder="Nuova cosa da fare" required><button class="btn">Aggiungi</button></form></section>`
  +`<section class="card"><div class="hh"><h2>Abitudini</h2><span class="sub" style="margin:0">${done}/${H}</span><button class="lnk" data-a="eh">${editH?'Fine':'Modifica'}</button></div><div class="chips">`
  +(H?S.habits.map(h=>`<span class="ch"><button class="chip ${d.checks[h.id]?'on':''}" data-a="hc" data-i="${h.id}" aria-pressed="${!!d.checks[h.id]}"><i></i>${esc(h.n)}</button>${editH?`<button class="del" data-a="dh" data-i="${h.id}" aria-label="Elimina abitudine">\u2715</button>`:''}</span>`).join(''):'<p class="empty">Nessuna abitudine. Tocca Modifica per aggiungerne.</p>')
  +`</div>`+(editH?`<form class="add" data-f="hb"><input name="t" placeholder="Nuova abitudine, es. Camminare 30 minuti" required><button class="btn">Aggiungi</button></form>`:'')+`</section>`
  +`<section class="card"><h2>${cur===today?'Prepara domani':'Prepara '+L(nx,{weekday:'long'})}</h2><p class="sub">Scrivi ora cosa vuoi fare il giorno dopo. Gli darai un orario quando ci arrivi.</p>`
  +dx.tasks.map(t=>`<div class="row"><span class="tx">${esc(t.t)}</span><button class="del" data-a="pt" data-i="${t.id}" aria-label="Elimina">\u2715</button></div>`).join('')
  +`<form class="add" data-f="nt"><input name="t" placeholder="Cosa farai?" required><button class="btn">Aggiungi</button></form></section>`;
}

function sett(){
  const a=add(wk,-((pd(wk).getDay()+6)%7)),b=add(a,6),ds=[...Array(7)].map((_,i)=>add(a,i)),st=stats(a,b);
  let f=0;ds.forEach(k=>{const d=S.days[k];if(d)f+=d.tasks.filter(t=>t.x).length+d.events.filter(t=>t.x).length});
  return head('Settimana',L(a,{day:'numeric',month:'short'})+' \u2013 '+L(b,{day:'numeric',month:'short'}),'wp','wn')
  +`<section class="card"><div class="big">${pc(st.tot,st.max)}%</div><p class="sub" style="margin-top:8px">delle abitudini completate. Cose fatte: ${f}.</p></section>`
  +`<section class="card"><h2>Abitudini</h2><div class="wk" style="margin-top:12px">${ds.map(k=>`<div class="dl ${k===today?'t':''}">${L(k,{weekday:'narrow'})}<br>${pd(k).getDate()}</div>`).join('')}</div>`
  +(S.habits.length?S.habits.map(h=>`<div class="hb"><div class="hn"><span>${esc(h.n)}</span><b>${pc(st.per[h.id],st.n)}%</b></div><div class="wk">${ds.map(k=>{const on=S.days[k]&&S.days[k].checks[h.id];return `<button class="dot ${on?'on':''} ${k>today?'fut':''}" data-a="wc" data-k="${k}" data-i="${h.id}" ${k>today?'disabled':''} aria-pressed="${!!on}" aria-label="${esc(h.n)}, ${L(k,{weekday:'long',day:'numeric'})}"></button>`}).join('')}</div></div>`).join(''):empty)+`</section>`;
}

function mese(){
  const[y,m]=mo.split('-').map(Number);
  const seg=`<div class="seg"><button class="${yr?'':'on'}" data-a="ym" data-y="0">Mese</button><button class="${yr?'on':''}" data-a="ym" data-y="1">Anno</button></div>`;
  if(yr){
    const ys=stats(y+'-01-01',y+'-12-31');
    const rows=[...Array(12)].map((_,i)=>{const mm=p(i+1),s=stats(y+'-'+mm+'-01',y+'-'+mm+'-'+p(new Date(y,i+1,0).getDate())),q=pc(s.tot,s.max);return `<div class="yr"><span>${cap(new Date(y,i,1).toLocaleDateString('it-IT',{month:'long'}))}</span><div class="pb"><i style="width:${q}%"></i></div><b>${q}%</b></div>`}).join('');
    return head(String(y),'Progressi dell\u2019anno','mp','mn')+seg
    +`<section class="card"><div class="big">${pc(ys.tot,ys.max)}%</div><p class="sub" style="margin-top:8px">delle abitudini completate nell\u2019anno.</p></section>`
    +`<section class="card"><h2>Mese per mese</h2>${rows}</section><section class="card"><h2>Per abitudine</h2>${hbars(ys)}</section>`;
  }
  const last=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7,H=S.habits.length||1,st=stats(mo+'-01',mo+'-'+p(last));
  let c='';for(let i=0;i<off;i++)c+='<span></span>';
  for(let i=1;i<=last;i++){const k=mo+'-'+p(i),d=S.days[k],q=k>today?0:Math.round(100*S.habits.filter(h=>d&&d.checks[h.id]).length/H);c+=`<button class="cell ${q>=60?'hi':''} ${k===today?'td':''}" style="--v:${q}%" data-a="go" data-k="${k}" aria-label="${L(k,{day:'numeric',month:'long'})}">${i}${d&&d.events.length?'<u></u>':''}</button>`}
  return head(cap(new Date(y,m-1,1).toLocaleDateString('it-IT',{month:'long'})),String(y),'mp','mn')+seg
  +`<section class="card"><div class="big">${pc(st.tot,st.max)}%</div><p class="sub" style="margin-top:8px">delle abitudini completate nel mese. Pi\u00f9 un giorno \u00e8 verde, pi\u00f9 hai fatto. Il puntino indica appuntamenti.</p>`
  +`<div class="cal">${['L','M','M','G','V','S','D'].map(x=>`<div class="dl">${x}</div>`).join('')}${c}</div></section><section class="card"><h2>Per abitudine</h2>${hbars(st)}</section>`;
}

function gl(sc,key){
  const g=S.goals.filter(x=>x.s===sc&&x.k===key),n=g.filter(x=>x.x).length;
  return (g.length?`<p class="sub">${n} di ${g.length} raggiunti</p><div class="pb" style="margin:0 0 6px"><i style="width:${pc(n,g.length)}%"></i></div>`:'')
  +(g.map(x=>`<div class="row ${x.x?'done':''}"><button class="ck ${x.x?'on':''}" data-a="xg" data-i="${x.id}" aria-label="Segna come raggiunto"></button><span class="tx">${esc(x.t)}</span><button class="del" data-a="dg" data-i="${x.id}" aria-label="Elimina">\u2715</button></div>`).join('')||'<p class="empty">Ancora nessun obiettivo.</p>')
  +`<form class="add" data-f="go" data-s="${sc}" data-k="${key}"><input name="t" placeholder="Nuovo obiettivo" required><button class="btn">Aggiungi</button></form>`;
}
async function backup(){
  const data=JSON.stringify(S,null,1),name='agenda-'+today+'.json';
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data});bmsg='Copia pronta.'}catch(e){bmsg=e&&e.code==='declined'?'Download annullato.':'Non sono riuscito a scaricare la copia.'}}
  else{try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();bmsg='Copia scaricata.'}catch(e){bmsg='Download non disponibile qui.'}}
  render();
}
function obi(){
  const[y,m]=gm.split('-').map(Number);
  return head('Obiettivi',cap(new Date(y,m-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})),'gp','gn')
  +`<section class="card"><h2>Del mese</h2>${gl('m',gm)}</section><section class="card"><h2>Dell\u2019anno ${y}</h2>${gl('y',String(y))}</section>`
  +`<section class="card"><h2>Copia di sicurezza</h2><p class="sub">Scarica un file con tutti i tuoi dati. Se lo ripristini, sostituisce i dati che hai ora.</p><div class="add"><button class="btn" data-a="bk">Scarica copia</button><label class="btn" for="rf">Ripristina da file</label></div><input id="rf" class="vh" type="file" accept=".json,application/json">${bmsg?`<p class="sub" style="margin-top:10px">${bmsg}</p>`:''}</section>`;
}

const N=document.getElementById('N'),A=document.getElementById('A');
const TB=[['oggi','Oggi'],['sett','Settimana'],['mese','Mese'],['obi','Obiettivi']];
function render(){
  N.innerHTML=TB.map(([k,l])=>`<button data-a="v" data-v="${k}" ${v===k?'aria-current="page"':''}>${l}</button>`).join('');
  A.innerHTML=({oggi,sett,mese,obi})[v]();
}
A.addEventListener('click',e=>navClick(e));
N.addEventListener('click',e=>navClick(e));
function navClick(e){
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=b.dataset.i,k=b.dataset.k;let top=false;
  if(a==='bk'){backup();return}
  else if(a==='v'){v=b.dataset.v;top=true;bmsg=''}
  else if(a==='dp')cur=add(cur,-1);
  else if(a==='dn')cur=add(cur,1);
  else if(a==='td')cur=today;
  else if(a==='xe'){const x=day(cur).events.find(z=>z.id===i);if(x)x.x=!x.x}
  else if(a==='de'){day(cur).events=day(cur).events.filter(z=>z.id!==i);selE=null}
  else if(a==='se')selE=selE===i?null:i;
  else if(a==='gv')gv=!gv;
  else if(a==='xt'){const x=day(cur).tasks.find(z=>z.id===i);if(x)x.x=!x.x}
  else if(a==='dt')day(cur).tasks=day(cur).tasks.filter(z=>z.id!==i);
  else if(a==='as')asg=asg===i?null:i;
  else if(a==='mv'){const d=day(cur),t=d.tasks.find(z=>z.id===i);if(t){d.tasks=d.tasks.filter(z=>z!==t);t.x=false;day(add(cur,1)).tasks.push(t)}}
  else if(a==='pt')day(add(cur,1)).tasks=day(add(cur,1)).tasks.filter(z=>z.id!==i);
  else if(a==='hc'){const c=day(cur).checks;c[i]=!c[i]}
  else if(a==='eh')editH=!editH;
  else if(a==='dh')S.habits=S.habits.filter(h=>h.id!==i);
  else if(a==='wp')wk=add(wk,-7);
  else if(a==='wn')wk=add(wk,7);
  else if(a==='wc'){const c=day(k).checks;c[i]=!c[i]}
  else if(a==='mp'||a==='mn'){const n=a==='mp'?-1:1;mo=yr?(Number(mo.slice(0,4))+n)+mo.slice(4):sm(mo,n)}
  else if(a==='ym')yr=b.dataset.y==='1';
  else if(a==='go'){cur=k;v='oggi';top=true}
  else if(a==='gp')gm=sm(gm,-1);
  else if(a==='gn')gm=sm(gm,1);
  else if(a==='xg'){const x=S.goals.find(z=>z.id===i);if(x)x.x=!x.x}
  else if(a==='dg')S.goals=S.goals.filter(z=>z.id!==i);
  save();render();if(top)window.scrollTo(0,0);
}
A.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,n=f.dataset.f,fd=new FormData(f),t=String(fd.get('t')||'').trim(),s=String(fd.get('s')||''),en=String(fd.get('e')||'');
  if(n==='ev'&&t&&s)day(cur).events.push({id:uid(),t,s,e:en>s?en:'',x:false});
  else if(n==='tk'&&t)day(cur).tasks.push({id:uid(),t,x:false});
  else if(n==='nt'&&t)day(add(cur,1)).tasks.push({id:uid(),t,x:false});
  else if(n==='as'&&s){const d=day(cur),tk=d.tasks.find(z=>z.id===f.dataset.i);if(tk){d.tasks=d.tasks.filter(z=>z!==tk);d.events.push({id:uid(),t:tk.t,s,e:'',x:false});asg=null}}
  else if(n==='hb'&&t)S.habits.push({id:uid(),n:t});
  else if(n==='go'&&t)S.goals.push({id:uid(),t,s:f.dataset.s,k:f.dataset.k,x:false});
  save();render();
  if(n!=='as'){const i=A.querySelector('[data-f="'+n+'"] input');if(i)i.focus()}
});
A.addEventListener('change',e=>{
  const f=e.target;if(f.id!=='rf'||!f.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.habits)||typeof x.days!=='object'||!x.days)throw 0;if(!Array.isArray(x.goals))x.goals=[];S=x;save();bmsg='Copia ripristinata.'}catch(er){bmsg='File non valido. Scegli una copia scaricata da questa agenda.'}render()};
  r.readAsText(f.files[0]);
});
render();
</script>
</body>
</html>
